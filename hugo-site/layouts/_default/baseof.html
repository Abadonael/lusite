<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/navigation.css?v={{ readFile "static/css/navigation.css" | sha256 }}">
  <link rel="stylesheet" href="/css/language.css">
  <link rel="stylesheet" href="/css/hero.css">
  <link rel="stylesheet" href="/css/profile.css">
  <link rel="stylesheet" href="/css/contact.css">
  <link rel="stylesheet" href="/css/articles.css">
  <link rel="stylesheet" href="/css/article-page.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/legal.css?v={{ readFile "static/css/legal.css" | sha256 }}">
  {{ if .Params.legal }}
    <link rel="canonical" href="{{ .Permalink }}">
    {{ range .AllTranslations }}
      <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
    {{ end }}
  {{ end }}
</head>



<body>

  {{ partial "header.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script src="/js/theme-toggle.js" defer></script>
</body>
</html>
