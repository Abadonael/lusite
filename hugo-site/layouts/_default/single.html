{{ define "main" }}
<article class="article-page legal-page container">
  <h1>{{ .Title }}</h1>
  {{ if and .Params.legal (not .Params.legalApproved) }}
    <p class="legal-review-note" role="note">{{ .Params.reviewNotice }}</p>
  {{ end }}
  <div class="article-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
