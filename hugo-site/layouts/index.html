{{ define "main" }}

<section class="hero container">
  <div class="hero-photo">
    <img src="{{ .Params.photo | default "/images/doctor.jpg" }}" alt="{{ .Params.photoAlt | default "Doctor portrait" }}">
  </div>

  <div class="hero-content">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>{{ .Params.name }}</h1>
    <p class="specialty">{{ .Params.specialty }}</p>
  </div>
</section>

{{ with .Content }}
<section class="profile-section container">
  <div class="text-column">{{ . }}</div>
</section>
{{ end }}

{{ end }}
